  <style>
    :root{--bg:#0d0e12;--panel:#17191f;--ink:#f6f4f0;--muted:#a7a9b4;--line:#2c303a;--violet:#a58cff;--violet2:#5d4a9a;--green:#49df8a;--green-bg:#10251a;--red:#ff7075;--red-bg:#2a171a;--shadow:0 22px 65px #0008}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,#281d41 0,transparent 34%),var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{width:min(1080px,calc(100% - 30px));margin:auto}.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}header{padding:66px 0 34px}.eyebrow{color:#cabdff;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end}h1{font-size:clamp(38px,7vw,72px);line-height:1.03;letter-spacing:-.05em;margin:13px 0 17px}h1 span{color:var(--violet)}.lede{max-width:690px;color:#c7c5ce;font-size:17px}.score{width:160px;height:160px;border-radius:50%;display:grid;place-content:center;text-align:center;background:conic-gradient(var(--violet) 0 100%,#34303d 0);position:relative;box-shadow:var(--shadow)}.score:before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--panel)}.score>*{position:relative}.score strong{font-size:40px;line-height:1}.score small{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0 38px}.summary article{background:linear-gradient(145deg,#211e2b,#16171c);border:1px solid var(--line);border-radius:18px;padding:19px}.summary b{display:block;color:#d7ccff;margin-bottom:5px}.summary p{margin:0;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:10;background:#0d0e12e8;backdrop-filter:blur(14px);border-block:1px solid var(--line);padding:11px 0}.toolbar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit}.filter,.action{border:1px solid #393d48;background:#1b1d24;color:#d8d6de;padding:9px 14px;border-radius:999px;cursor:pointer}.filter.active{background:var(--violet2);border-color:#a58cff;color:#fff}.action{background:transparent}.count{color:var(--muted);margin-right:auto}.question{border:1px solid var(--line);border-radius:22px;background:var(--panel);overflow:hidden;margin:18px 0;box-shadow:0 13px 40px #0003}.qhead{display:flex;gap:17px;align-items:center;padding:21px 23px;border-bottom:1px solid var(--line)}.num{width:48px;height:48px;border-radius:15px;background:#6652a1;display:grid;place-items:center;font-weight:900;font-size:18px;flex:0 0 auto}.qhead>div{flex:1}.tag{font-size:11px;color:#c9bcf0;letter-spacing:.12em;font-weight:800}.qhead h2{font-size:20px;line-height:1.55;margin:2px 0 0}.qhead u{text-decoration-color:var(--violet);text-decoration-thickness:2px;text-underline-offset:5px}.speak{border:1px solid #4a435a;background:#231f2d;color:#ded4ff;border-radius:999px;padding:8px 12px;cursor:pointer}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 23px}.option{display:flex;gap:12px;align-items:center;min-height:58px;padding:12px 15px;border:1px solid #333741;border-radius:13px;background:#13151a;color:#c2c2ca}.quiz .option{cursor:pointer}.quiz .option:focus-visible{outline:3px solid var(--violet);outline-offset:2px}.choice{width:30px;height:30px;border:2px solid #676b76;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-weight:800}.wrong{border-color:#71343a;background:var(--red-bg);color:#ffd7d8}.wrong .choice{border-color:var(--red);color:var(--red)}.correct{border-color:#286c43;background:var(--green-bg);color:#d8ffe7}.correct .choice{border-color:var(--green);color:var(--green)}.badge{margin-left:auto;font-size:10px;letter-spacing:.08em;font-weight:900}.study{border-top:1px solid var(--line)}summary{list-style:none;cursor:pointer;padding:15px 23px;color:#d2c5f7;font-weight:800;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:"＋";font-size:20px}.study[open] summary:after{content:"−"}.explain{padding:0 23px 23px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:11px}.note{background:#111318;border:1px solid #2d3039;padding:15px;border-radius:14px}.note h3{margin:0 0 6px;color:#ad98ec;font-size:12px;letter-spacing:.08em}.note p{margin:0;color:#c9c7cf}.quiz .correct,.quiz .wrong{border-color:#333741;background:#13151a;color:#c2c2ca}.quiz .correct .choice,.quiz .wrong .choice{border-color:#676b76;color:inherit}.quiz .badge,.quiz details{display:none}.quiz .option.reveal-correct{border-color:#286c43;background:var(--green-bg);color:#d8ffe7}.quiz .option.reveal-wrong{border-color:#71343a;background:var(--red-bg);color:#ffd7d8}.quiz .option.reveal-correct .badge,.quiz .option.reveal-wrong .badge{display:block}.hidden{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.footer{text-align:center;color:#777b86;padding:34px 0 60px}.footer a{color:#b9a8ed}@media(max-width:740px){header{padding-top:40px}.hero{display:block}.score{width:116px;height:116px;margin-top:24px}.score strong{font-size:29px}.summary,.options,.explain{grid-template-columns:1fr}.qhead{align-items:flex-start;flex-wrap:wrap}.speak{margin-left:65px}.count{width:100%;order:5}.qhead h2{font-size:18px}}@media print{.toolbar,.score,.summary,.speak{display:none}body{background:#fff;color:#111}.question{break-inside:avoid;background:#fff;box-shadow:none}.question,.qhead,.study,.option,.note{border-color:#bbb}.qhead h2,.note p{color:#111}.correct,.quiz .correct{border-color:#7b9f87;background:#e9f8ee;color:#111}.wrong,.quiz .wrong{border-color:#b98a8a;background:#fff0f0;color:#111}.quiz details{display:block}.quiz .badge{display:block}.study .explain{display:grid}.footer{color:#555}}

  <header class="wrap"><div class="hero"><div><div class="eyebrow">2023年7月 · JLPT N3</div><h1>把錯題，<br><span>變成得分點。</span></h1><p class="lede">22 題文字、語彙、文法、讀解與聽解錯題。綠色是正確答案，紅色是當時選錯的答案；展開解析，掌握每個干擾選項為什麼不對。</p></div><div class="score"><strong>22</strong><small>題錯題<br>一次複習</small></div></div>
    <section class="summary" aria-label="反覆出現的弱點"><article><b>01 · 讀音與表記容易被相似音帶走</b><p>小型、疑う、退院、留守、短気都要把整個單字一起記，不要逐字猜音。</p></article><article><b>02 · 文法要看前後呼應</b><p>しか～ない、にしたがって、～まで、～ておく等，都需要同時看句尾與語境。</p></article><article><b>03 · 文章連接與情境推論</b><p>そのうえ、指示詞、文章結尾和聽解回應，關鍵在前後邏輯是否自然。</p></article></section>

  <script>
    const questions=[
      {n:2,cat:'reading',prompt:'<u>小型</u>のラジオが欲しいです。',options:['こかた','しょうがた','こがた','しょうかた'],wrong:2,correct:3,why:'「小型」讀作「こがた」，表示小型。整句是「我想要一台小型收音機」。',key:'「大型（おおがた）／小型（こがた）」成對記。型在複合詞常讀「がた」。',miss:'② しょうがた把「小」直讀成 しょう；這個固定詞不用音讀。'},
      {n:3,cat:'reading',prompt:'理由もないのに、人を<u>疑って</u>はいけない。',options:['きらって','こわがって','しかって','うたがって'],wrong:3,correct:4,why:'「疑う（うたがう）」是懷疑。沒有理由就不可以懷疑別人。',key:'疑う→疑って；「疑問（ぎもん）」雖是音讀，但動詞要記訓讀 うたがう。',miss:'③ 叱って（しかって）是責罵，和「懷疑」不是同一個動作。'},
      {n:5,cat:'reading',prompt:'川井さんは明日、<u>退院</u>するそうです。',options:['たいいん','たんいん','だいいん','だんいん'],wrong:3,correct:1,why:'「退院」讀作「たいいん」，指辦理出院。',key:'退（たい）＋院（いん）；兩個 i 音都要保留：たい・いん。',miss:'③ だいいん把「退」濁化成 だい，讀音不正確。'},
      {n:7,cat:'reading',prompt:'<u>留守</u>の間に誰か来たようだ。',options:['るしゅ','るす','りゅうす','りゅうしゅ'],wrong:3,correct:2,why:'「留守」讀作「るす」，表示不在家或看家。',key:'固定詞：留守にする＝不在家；留守番＝看家。',miss:'③ りゅうす是依單字音讀硬猜的讀法；日常固定讀音是 るす。'},
      {n:9,cat:'reading',prompt:'彼は<u>たんき</u>だ。',options:['男気','単気','短気','断気'],wrong:2,correct:3,why:'「短気」表示性子急、容易生氣。',key:'短＝短；気＝脾氣。短気（たんき）＝急性子。',miss:'②「単気」不是這個意思的標準表記；不要只靠同音選漢字。'},
      {n:17,cat:'vocab',prompt:'ゆうべはほとんど寝ていないので、今日は眠くて何度も（　）が出てしまう。',options:['しゃっくり','くしゃみ','せき','あくび'],wrong:1,correct:4,why:'沒睡飽會一直「打哈欠」，所以選「あくび」。',key:'あくび＝哈欠；くしゃみ＝噴嚏；せき＝咳嗽；しゃっくり＝打嗝。',miss:'① しゃっくり是打嗝，和睏倦沒有直接關係。'},
      {n:20,cat:'vocab',prompt:'（　）して、鍵をかけないで家を出てしまった。',options:['はっきり','しっかり','ぴったり','うっかり'],wrong:3,correct:4,why:'「うっかりして」表示一不小心、疏忽，正好說明忘了鎖門。',key:'うっかり＋忘れる／間違える／落とす，是常見搭配。',miss:'③ ぴったり表示尺寸剛好或緊密相合，不能表示疏忽。'},
      {n:27,cat:'vocab',prompt:'この部分を暗記してください。',options:['読んで','書いて','覚えて','教えて'],wrong:2,correct:3,why:'「暗記する」就是背下來、記住，所以可換成「覚えて」。',key:'暗記する＝覚える；読んだ或書いた不代表已經記住。',miss:'② 書いて只是寫下來，沒有「背熟」的意思。'},
      {n:35,cat:'vocab',prompt:'にこにこ',options:['ガソリンが少なくなって、車が途中で止まりそうでにこにこした。','大勢の前歌ったとき、緊張して胸がにこにこした。','昨日から具合が悪くて、今朝も頭が少しにこにこしている。','遊んでいる私たちを見て、祖母はうれしそうににこにこしていた。'],wrong:2,correct:4,why:'「にこにこ」形容笑咪咪的樣子；祖母看著孩子玩，開心地微笑最自然。',key:'笑う表情：にこにこ。車快沒油、緊張、頭不舒服都不能用它。',miss:'② 緊張時胸口應是「どきどき」，不是「にこにこ」。原題文字照截圖保留。'},
      {n:36,cat:'grammar',prompt:'歌手の青山ケイは、海外でも人気があり、アジア（　）中心にいろいろな国でコンサートを行っている。',options:['が','で','の','を'],wrong:3,correct:4,why:'固定句型「Nを中心に」表示以 N 為中心。',key:'アジアを中心に＝以亞洲為中心；活動範圍再延伸到其他國家。',miss:'③ の中心に表示「在……的中心位置」，不符合「以亞洲為主要區域」的意思。'},
      {n:37,cat:'grammar',prompt:'南中学校で、読書の習慣について調査が行われた。調査の結果を見ると、学年が上がる（　）生徒の読書時間が減っていることがわかる。',options:['ことから','としたら','にしたがって','のに比べて'],wrong:2,correct:3,why:'「～にしたがって」表示隨著前項變化，後項也跟著變化：年級愈高，閱讀時間愈少。',key:'AにしたがってB＝隨著 A，B 也逐步變化。',miss:'② としたら是「假設……的話」，不是描述調查中已觀察到的趨勢。'},
      {n:38,cat:'grammar',prompt:'友達に誘われて、夏休みに二人で海外旅行に行くことになった。海外旅行は今まで家族（　）行ったことがないので、楽しみだ。',options:['だけで','だけが','となら','としか'],wrong:3,correct:4,why:'「家族としか行ったことがない」表示至今只和家人去過。しか要搭配否定。',key:'Nとしか～ない＝除了和 N 以外沒有……。',miss:'③ となら是條件「如果和……」，無法和「行ったことがない」形成限定語意。'},
      {n:41,cat:'grammar',prompt:'（病院の受付で）<br>受付の人「お名前が（　）、診察室の前でお待ちください。」',options:['呼ぶと','呼ぶまで','呼ばれると','呼ばれるまで'],wrong:3,correct:4,why:'名字是「被叫到」，而且要等到那個時間點，所以用「呼ばれるまで」。',key:'受身＋まで：お名前が呼ばれるまで＝直到名字被叫到為止。',miss:'③ 呼ばれると表示「一被叫到就……」，但後面是「請等待」，時間關係相反。'},
      {n:43,cat:'grammar',prompt:'明日の授業までにテキストを30ページまで（　）のに、まだ全然読んでいない。',options:['読んでおいてはいけない','読んでおかなければならない','読むことにしてはいけない','読むことにしなければならない'],wrong:4,correct:2,why:'上課前必須先讀到第30頁，所以是「読んでおかなければならない」。',key:'Vておく＝事先做；Vておかなければならない＝必須事先完成。',miss:'④ 読むことにする是自己決定要讀，沒有「事前準備必須完成」的語感。'},
      {n:45,cat:'grammar',prompt:'私の夢は、いつか自分のケーキ屋を（　）。',options:['開くと思う','開きたいと思う','開くことだ','開きたいことだ'],wrong:2,correct:3,why:'「夢は～ことだ」用名詞化句子說明夢想內容：夢想是有一天開自己的蛋糕店。',key:'私の夢は＋動詞辭書形＋ことだ。主語已經表明是「我的夢」。',miss:'② 開きたいと思う是「我想開」，若接在「私の夢は」後，句型結構不完整。'},
      {n:46,cat:'grammar',prompt:'妻「雨、全然（　）ね。今日は出かけるのやめようか。」<br>夫「そうだね。」',options:['やまないはずがない','やみそうにない','やむに違いない','やんでもしかたない'],wrong:1,correct:2,why:'「やみそうにない」表示看起來不會停；因此才提議今天別出門。',key:'Vます語幹＋そうにない＝看起來不會……。雨がやみそうにない。',miss:'① やまないはずがない是「不可能不停」，反而表示雨一定會停，與下句矛盾。'},
      {n:52,cat:'grammar',prompt:'今朝は急いでいたから、＿＿　＿＿　★　＿＿しまった。',options:['玄関の電気を消すのを','きて','家を出て','忘れて'],wrong:1,correct:3,why:'完整順序是 ①→④→③→②：玄関の電気を消すのを忘れて、家を出てきてしまった。★位置是③「家を出て」。',key:'「Vるのを忘れる」＋「家を出てくる」＋「～てしまう」。先組固定搭配再排順序。',miss:'① 是整句第一塊，不是★所在的第三格；★題問的是指定位置，不是句首。'},
      {n:54,cat:'readingcomp',prompt:'作文〈ガソリンスタンドのサービス〉【19】<br>私は自分でガソリンを入れる店（　）知りませんでした。',options:['は','も','だけ','しか'],wrong:3,correct:4,why:'作者以前只知道自助加油站，因此是「店しか知りませんでした」：只知道那種店。',key:'しか必須搭配否定：Nしか＋否定＝除了 N 以外都不……／只……。',miss:'③ だけ可表示「只有」，但原文句尾是「知りませんでした」；和否定呼應時應用 しか。'},
      {n:55,cat:'readingcomp',prompt:'同篇作文【20】<br>友達が窓を閉めると、すぐに店員がガソリンを入れ始めたので、驚きました。（　）、別の店員が来て、車の窓も丁寧に拭いてくれたのです。',options:['ただ','例えば','そのうえ','ところが'],wrong:4,correct:3,why:'加油之外，另一位店員還來擦車窗；「そのうえ」表示而且、再加上，延續追加資訊。',key:'そのうえ＝而且；ところが＝然而。先判斷前後是追加還是轉折。',miss:'④ ところが會導入相反或出乎意料的轉折；這裡是服務項目增加，不是反轉。'},
      {n:56,cat:'readingcomp',prompt:'作文〈仲間からのメッセージ〉【21】<br>もらったカードは部屋に飾って、（　）に行く前に必ず見ています。',options:['そこ','大学','その大学','そういうところ'],wrong:1,correct:2,why:'作者辭掉打工是因為大學課業變忙；每天去「大学」前看卡片，語意最直接。',key:'文章已明說「今学期から勉強が忙しくなって」；此處需要具體目的地名詞。',miss:'① そこ需要一個清楚的先行地點，但前文最近的焦點是打工店，不是每天要去的地方。'},
      {n:57,cat:'readingcomp',prompt:'同篇作文【22】<br>頑張って働いた2年間が目に見えるものになった感じがして、カードを見ると、元気が出ます。どんなに勉強が大変になっても、（　）。',options:['頑張っているのです','頑張ることができるからです','頑張っているみたいです','頑張ることができそうです'],wrong:4,correct:2,why:'卡片讓作者有精神，因此成為「無論課業多辛苦都能繼續努力」的理由，用「からです」收束全文。',key:'前句提供原因，結尾「～ことができるからです」清楚說明卡片的力量。',miss:'④ できそうです只是「看起來能做到」，沒有把原因結果完整連起來。'},
      {n:100,cat:'listening',prompt:'雷が鳴ってるね。旅館につくまで雨が降らなければいいんだけど。',options:['あ、降ってきたんだね。','急いだほうがよさそうだね。','え、降ったほうがいいの？'],wrong:3,correct:2,why:'說話者擔心到旅館前下雨，最自然的回應是「看來最好快一點」。',key:'～なければいい＝希望不要……；聽到雷聲後的行動推論是加快腳步。',miss:'③ 把「不要下雨才好」誤解成「下雨比較好嗎」，正好顛倒原意。'}
    ];
    const labels={reading:'讀音・表記',vocab:'語彙・用法',grammar:'文法・句型',readingcomp:'讀解・文章',listening:'聽解・即時應答'};
    const deck=document.querySelector('#deck');
    deck.innerHTML=questions.map(q=>`<article class="question" data-cat="${q.cat}"><div class="qhead"><span class="num">${String(q.n).padStart(2,'0')}</span><div><div class="tag">${labels[q.cat]}</div><h2 class="jp">${q.prompt}</h2></div><button class="speak" data-speak="${q.prompt.replace(/<br>/g,'。').replace(/<[^>]+>/g,'').replace(/[＿＿★【】]/g,'')}">🔊 朗讀</button></div><div class="options">${q.options.map((o,i)=>`<div class="option ${i+1===q.wrong?'wrong':''} ${i+1===q.correct?'correct':''}"><span class="choice">${i+1}</span><span class="jp">${o}</span>${i+1===q.wrong?'<small class="badge">你的答案</small>':''}${i+1===q.correct?'<small class="badge">正確答案</small>':''}</div>`).join('')}</div><p class="sr-only result" aria-live="polite"></p><details class="study"><summary>展開繁體中文解析</summary><div class="explain"><div class="note"><h3>為什麼正確</h3><p>${q.why}</p></div><div class="note"><h3>記憶重點／關鍵線索</h3><p>${q.key}</p></div><div class="note"><h3>為什麼你選錯</h3><p>${q.miss}</p></div></div></details></article>`).join('');
    const cards=[...document.querySelectorAll('.question')],filters=[...document.querySelectorAll('.filter')],count=document.querySelector('#count'),quiz=document.querySelector('#quiz');
    filters.forEach((b,i)=>{b.setAttribute('aria-pressed',i===0?'true':'false');b.addEventListener('click',()=>{filters.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');let n=0;cards.forEach(q=>{const show=b.dataset.filter==='all'||q.dataset.cat===b.dataset.filter;q.classList.toggle('hidden',!show);if(show)n++});count.textContent=`顯示 ${n} 題`})});
    document.querySelector('#expand').addEventListener('click',e=>{const open=e.target.textContent==='全部展開';document.querySelectorAll('.study').forEach(d=>d.open=open);e.target.textContent=open?'全部收合':'全部展開'});
    quiz.addEventListener('click',()=>{document.body.classList.toggle('quiz');const on=document.body.classList.contains('quiz');quiz.textContent=on?'離開自我測驗':'自我測驗模式';quiz.setAttribute('aria-pressed',String(on));cards.forEach(q=>{q.querySelector('.result').textContent='';q.querySelectorAll('.option').forEach(o=>{o.classList.remove('reveal-correct','reveal-wrong');o.toggleAttribute('role',on);if(on)o.setAttribute('role','button');o.toggleAttribute('tabindex',on);if(on)o.tabIndex=0;o.removeAttribute('aria-pressed')})})});
    function answer(e){if(!document.body.classList.contains('quiz'))return;const o=e.target.closest('.option');if(!o)return;const q=o.closest('.question'),correct=q.querySelector('.correct'),right=o===correct;q.querySelectorAll('.option').forEach(x=>{x.classList.remove('reveal-correct','reveal-wrong');x.setAttribute('aria-pressed','false')});o.classList.add(right?'reveal-correct':'reveal-wrong');correct.classList.add('reveal-correct');o.setAttribute('aria-pressed','true');q.querySelector('.result').textContent=right?'答對了。':'答錯了；正確答案已用綠色標示。'}
    deck.addEventListener('click',e=>{const s=e.target.closest('.speak');if(s){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.dataset.speak);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u);return}answer(e)});deck.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.option')){e.preventDefault();answer(e)}});window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
  </script>
</body>
</html>
