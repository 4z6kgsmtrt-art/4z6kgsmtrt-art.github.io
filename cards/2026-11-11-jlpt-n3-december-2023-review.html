<!doctype html>
<html lang="zh-Hant-TW">

  <meta name="description" content="2023年12月 JLPT N3 文字・語彙錯題精讀：10 題繁體中文解析、自我測驗與日文朗讀。">
  <title>2023年12月 JLPT N3 錯題精讀</title>
  <style>
    :root{--bg:#0d0e12;--panel:#17191f;--panel2:#20232b;--ink:#f6f4f0;--muted:#a7a9b4;--line:#2c303a;--violet:#a58cff;--violet2:#5d4a9a;--green:#49df8a;--green-bg:#10251a;--red:#ff7075;--red-bg:#2a171a;--amber:#ffd166;--shadow:0 22px 65px #0008}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,#281d41 0,transparent 34%),var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{width:min(1080px,calc(100% - 30px));margin:auto}.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}header{padding:66px 0 34px}.eyebrow{color:#cabdff;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end}h1{font-size:clamp(38px,7vw,72px);line-height:1.03;letter-spacing:-.05em;margin:13px 0 17px}h1 span{color:var(--violet)}.lede{max-width:690px;color:#c7c5ce;font-size:17px}.score{width:160px;height:160px;border-radius:50%;display:grid;place-content:center;text-align:center;background:conic-gradient(var(--violet) 0 100%,#34303d 0);position:relative;box-shadow:var(--shadow)}.score:before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--panel)}.score>*{position:relative}.score strong{font-size:40px;line-height:1}.score small{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0 38px}.summary article{background:linear-gradient(145deg,#211e2b,#16171c);border:1px solid var(--line);border-radius:18px;padding:19px}.summary b{display:block;color:#d7ccff;margin-bottom:5px}.summary p{margin:0;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:10;background:#0d0e12e8;backdrop-filter:blur(14px);border-block:1px solid var(--line);padding:11px 0}.toolbar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit}.filter,.action{border:1px solid #393d48;background:#1b1d24;color:#d8d6de;padding:9px 14px;border-radius:999px;cursor:pointer}.filter.active{background:var(--violet2);border-color:#a58cff;color:#fff}.action{background:transparent}.count{color:var(--muted);margin-right:auto}.question{border:1px solid var(--line);border-radius:22px;background:var(--panel);overflow:hidden;margin:18px 0;box-shadow:0 13px 40px #0003}.qhead{display:flex;gap:17px;align-items:center;padding:21px 23px;border-bottom:1px solid var(--line)}.num{width:48px;height:48px;border-radius:15px;background:#6652a1;display:grid;place-items:center;font-weight:900;font-size:18px;flex:0 0 auto}.qhead>div{flex:1}.tag{font-size:11px;color:#c9bcf0;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.qhead h2{font-size:21px;line-height:1.45;margin:2px 0 0}.qhead u{text-decoration-color:var(--violet);text-decoration-thickness:2px;text-underline-offset:5px}.speak{border:1px solid #4a435a;background:#231f2d;color:#ded4ff;border-radius:999px;padding:8px 12px;cursor:pointer}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 23px}.option{display:flex;gap:12px;align-items:center;min-height:58px;padding:12px 15px;border:1px solid #333741;border-radius:13px;background:#13151a;color:#c2c2ca}.quiz .option{cursor:pointer}.quiz .option:focus-visible{outline:3px solid var(--violet);outline-offset:2px}.choice{width:30px;height:30px;border:2px solid #676b76;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-weight:800}.wrong{border-color:#71343a;background:var(--red-bg);color:#ffd7d8}.wrong .choice{border-color:var(--red);color:var(--red)}.correct{border-color:#286c43;background:var(--green-bg);color:#d8ffe7}.correct .choice{border-color:var(--green);color:var(--green)}.badge{margin-left:auto;font-size:10px;letter-spacing:.08em;font-weight:900}.study{border-top:1px solid var(--line)}summary{list-style:none;cursor:pointer;padding:15px 23px;color:#d2c5f7;font-weight:800;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:"＋";font-size:20px}.study[open] summary:after{content:"−"}.explain{padding:0 23px 23px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:11px}.note{background:#111318;border:1px solid #2d3039;padding:15px;border-radius:14px}.note h3{margin:0 0 6px;color:#ad98ec;font-size:12px;letter-spacing:.08em}.note p{margin:0;color:#c9c7cf}.quiz .correct,.quiz .wrong{border-color:#333741;background:#13151a;color:#c2c2ca}.quiz .correct .choice,.quiz .wrong .choice{border-color:#676b76;color:inherit}.quiz .badge,.quiz details{display:none}.quiz .option.reveal-correct{border-color:#286c43;background:var(--green-bg);color:#d8ffe7}.quiz .option.reveal-wrong{border-color:#71343a;background:var(--red-bg);color:#ffd7d8}.quiz .option.reveal-correct .badge,.quiz .option.reveal-wrong .badge{display:block}.hidden{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.footer{text-align:center;color:#777b86;padding:34px 0 60px}.footer a{color:#b9a8ed}@media(max-width:740px){header{padding-top:40px}.hero{display:block}.score{width:116px;height:116px;margin-top:24px}.score strong{font-size:29px}.summary,.options,.explain{grid-template-columns:1fr}.qhead{align-items:flex-start;flex-wrap:wrap}.speak{margin-left:65px}.count{width:100%;order:5}.qhead h2{font-size:18px}}@media print{.toolbar,.score,.summary,.speak{display:none}body{background:#fff;color:#111}.question{break-inside:avoid;background:#fff;box-shadow:none}.question,.qhead,.study,.option,.note{border-color:#bbb}.qhead h2,.note p{color:#111}.correct,.quiz .correct{border-color:#7b9f87;background:#e9f8ee;color:#111}.wrong,.quiz .wrong{border-color:#b98a8a;background:#fff0f0;color:#111}.quiz details{display:block}.quiz .badge{display:block}.study .explain{display:grid}.footer{color:#555}}
  </style>
</head>
<body>
  <header class="wrap"><div class="hero"><div><div class="eyebrow">2023年12月 · JLPT N3 文字・語彙</div><h1>錯一次，<br><span>記得更牢。</span></h1><p class="lede">10 題錯題集中複習。綠色是正確答案，紅色是當時選錯的答案；展開繁體中文解析，掌握讀音、語境與詞語用法。</p></div><div class="score"><strong>10</strong><small>題錯題<br>一次複習</small></div></div>
    <section class="summary" aria-label="反覆出現的弱點"><article><b>01 · 讀音細節與漢字辨識</b><p>選手、産業要分清長音與濁音；帰宅、空則要從語意選出正確漢字。</p></article><article><b>02 · 動作要和受詞搭配</b><p>舌でなめる、スーツケースに詰める等，不能只靠中文大意選動詞。</p></article><article><b>03 · 副詞與名詞的語境精準度</b><p>おたがいに、きちんと、ヒント都要抓句中的關係與目的。</p></article></section>
  </header>
  <nav class="toolbar"><div class="wrap"><button class="filter active" data-filter="all">全部 10 題</button><button class="filter" data-filter="reading">漢字讀音</button><button class="filter" data-filter="context">語彙・文脈</button><button class="filter" data-filter="usage">用法判斷</button><span class="count" id="count">顯示 10 題</span><button class="action" id="expand">全部展開</button><button class="action" id="quiz">自我測驗模式</button></div></nav>
  <main class="wrap" id="deck"></main>
  <footer class="footer"><a href="../index.html">← 回到日語 N3 精讀卡片集</a><br>點選喇叭可用瀏覽器朗讀日文</footer>
  <script>
    const questions=[
      {n:2,cat:'reading',prompt:'体育館に<u>選手</u>が入ってきました。',options:['ぜんしゅ','せんしゅう','せんしゅ','ぜんしゅう'],wrong:2,correct:3,why:'選手讀作「せんしゅ」，意思是運動選手。句子是「選手走進體育館了」。',key:'「選」是 せん，「手」在這個詞讀 しゅ；沒有長音。連同「選手（せんしゅ）」整組記。',miss:'②「せんしゅう」多了一個長音 う；「先週」才讀作 せんしゅう，意思是上週。'},
      {n:5,cat:'reading',prompt:'この町の<u>産業</u>について話を聞いた。',options:['じょうぎょう','ざんぎょう','しょうぎょう','さんぎょう'],wrong:2,correct:4,why:'産業讀作「さんぎょう」，指產業。整句是「聽了關於這個城鎮產業的介紹」。',key:'産＝さん；業＝ぎょう。濁音在「ぎょう」，不是「ざん」。',miss:'②「ざんぎょう」是「残業（加班）」的讀音，漢字和意思都不同。'},
      {n:10,cat:'reading',prompt:'いつも7時には<u>きたく</u>している。',options:['着宅','帰室','帰宅','着室'],wrong:1,correct:3,why:'きたく寫作「帰宅」，意思是回家。句子是「我通常七點以前就回到家」。',key:'帰＝回去；宅＝家。固定詞「帰宅する」就是回家。',miss:'①「着宅」不是一般日語詞。容易因「到著」聯想到「着」，但 きたく 的 き 是「帰」。'},
      {n:13,cat:'reading',prompt:'袋の中は<u>から</u>でした。',options:['無','空','欠','穴'],wrong:4,correct:2,why:'「空」可讀作 から，表示裡面沒有東西。句子是「袋子裡是空的」。',key:'「空っぽ」也是空空的；「空（から）の箱」＝空箱。',miss:'④「穴」讀作 あな，表示孔洞。袋子有洞和袋子裡是空的，是兩種完全不同的狀態。'},
      {n:15,cat:'context',prompt:'クイズの答えが分からないので、何か（　）が欲しい。',options:['ヒント','マナー','アドレス','チェック'],wrong:4,correct:1,why:'不知道猜謎答案時，需要的是「ヒント（提示、線索）」。',key:'「ヒントが欲しい」是常見搭配；目的在於幫助想到答案。',miss:'④ チェック是檢查、確認或勾選，不是用來引導你找到答案的線索。'},
      {n:18,cat:'context',prompt:'田中さんの部屋は、本や服が（　）整理されていて、きれいですね。',options:['はっきり','なるべく','そっと','きちんと'],wrong:1,correct:4,why:'「きちんと整理されている」表示整理得整整齊齊、井然有序。',key:'固定搭配：きちんと整理する／並べる／片づける。',miss:'① はっきり表示清楚明確，常修飾「見える、言う、分かる」，不能表示房間收拾整齊。'},
      {n:21,cat:'context',prompt:'林さんと森さんは、（　）顔は知っているが、話したことはないそうだ。',options:['たまに','ついでに','おたがいに','おもに'],wrong:1,correct:3,why:'兩人都認得對方的臉，所以是「おたがいに（彼此、互相）顔は知っている」。',key:'主語是 A と B，後面描述雙向關係時，要想到「おたがいに」。',miss:'① たまに是偶爾，只表示頻率；「偶爾知道臉」語意不成立。'},
      {n:24,cat:'context',prompt:'砂糖か塩か分からなかったので、舌で（　）みた。',options:['かじって','なめて','かんで','まぜて'],wrong:1,correct:2,why:'分不清糖或鹽時，用舌頭「なめてみる（舔看看）」最自然。',key:'舌でなめる＝用舌頭舔；「～てみる」表示試著做。',miss:'① かじる是咬下一小口，通常用牙齒對較硬或有形的食物；砂糖或鹽用舌頭舔才合理。'},
      {n:25,cat:'context',prompt:'少し熱があって、体も（　）ので、今日は仕事を休もうと思う。',options:['だるい','まぶしい','ぬるい','にがい'],wrong:3,correct:1,why:'發燒時身體「だるい（倦怠、疲軟）」最符合身體不適的語境。',key:'常見搭配：体がだるい。和發燒、疲勞、感冒一起出現。',miss:'③ ぬるい表示水或飲料溫溫的、不夠熱，不能用來形容身體疲倦。'},
      {n:35,cat:'usage',prompt:'詰める',options:['旅行に持っていく物をスーツケースに詰めておきます。','味が薄かったので、スープに塩とこしょうを詰めました。','お客さんのコップに水を詰めてください。','時々窓を開けて、部屋の中に新鮮な空気を詰めた。'],wrong:2,correct:1,why:'「詰める」可表示把東西塞入、裝入容器；把旅行用品裝進行李箱最自然。',key:'荷物をスーツケースに詰める＝把行李裝進行李箱。也可指縮短間距、填滿空位。',miss:'② 湯裡加鹽和胡椒要說「入れる」。③ 倒水用「注ぐ／入れる」；④ 換新鮮空氣用「入れ替える」。'}
    ];
    const labels={reading:'漢字讀音',context:'語彙・文脈',usage:'用法判斷'};
    const deck=document.querySelector('#deck');
    deck.innerHTML=questions.map(q=>`<article class="question" data-cat="${q.cat}"><div class="qhead"><span class="num">${String(q.n).padStart(2,'0')}</span><div><div class="tag">${labels[q.cat]}</div><h2 class="jp">${q.prompt}</h2></div><button class="speak" data-speak="${q.prompt.replace(/<[^>]+>/g,'')}">🔊 朗讀</button></div><div class="options">${q.options.map((o,i)=>`<div class="option ${i+1===q.wrong?'wrong':''} ${i+1===q.correct?'correct':''}"><span class="choice">${i+1}</span><span class="jp">${o}</span>${i+1===q.wrong?'<small class="badge">你的答案</small>':''}${i+1===q.correct?'<small class="badge">正確答案</small>':''}</div>`).join('')}</div><p class="sr-only result" aria-live="polite"></p><details class="study"><summary>展開繁體中文解析</summary><div class="explain"><div class="note"><h3>為什麼正確</h3><p>${q.why}</p></div><div class="note"><h3>記憶重點／關鍵線索</h3><p>${q.key}</p></div><div class="note"><h3>為什麼你選錯</h3><p>${q.miss}</p></div></div></details></article>`).join('');
    const cards=[...document.querySelectorAll('.question')],filters=[...document.querySelectorAll('.filter')],count=document.querySelector('#count'),quiz=document.querySelector('#quiz');
    filters.forEach((b,i)=>{b.setAttribute('aria-pressed',i===0?'true':'false');b.addEventListener('click',()=>{filters.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');let n=0;cards.forEach(q=>{const show=b.dataset.filter==='all'||q.dataset.cat===b.dataset.filter;q.classList.toggle('hidden',!show);if(show)n++});count.textContent=`顯示 ${n} 題`})});
    document.querySelector('#expand').addEventListener('click',e=>{const open=e.target.textContent==='全部展開';document.querySelectorAll('.study').forEach(d=>d.open=open);e.target.textContent=open?'全部收合':'全部展開'});
    quiz.addEventListener('click',()=>{document.body.classList.toggle('quiz');const on=document.body.classList.contains('quiz');quiz.textContent=on?'離開自我測驗':'自我測驗模式';cards.forEach(q=>{q.querySelector('.result').textContent='';q.querySelectorAll('.option').forEach(o=>{o.classList.remove('reveal-correct','reveal-wrong');o.toggleAttribute('role',on);if(on)o.setAttribute('role','button');o.toggleAttribute('tabindex',on);if(on)o.tabIndex=0;o.removeAttribute('aria-pressed')})})});
    function answer(e){if(!document.body.classList.contains('quiz'))return;const o=e.target.closest('.option');if(!o)return;const q=o.closest('.question'),correct=q.querySelector('.correct'),right=o===correct;q.querySelectorAll('.option').forEach(x=>{x.classList.remove('reveal-correct','reveal-wrong');x.setAttribute('aria-pressed','false')});o.classList.add(right?'reveal-correct':'reveal-wrong');correct.classList.add('reveal-correct');o.setAttribute('aria-pressed','true');q.querySelector('.result').textContent=right?'答對了。':'答錯了；正確答案已用綠色標示。'}
    deck.addEventListener('click',e=>{const s=e.target.closest('.speak');if(s){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.dataset.speak);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u);return}answer(e)});deck.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.option')){e.preventDefault();answer(e)}});window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
  </script>
</body>
